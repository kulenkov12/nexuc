<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus Chat | Рабочий мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) {
            body { padding: 0; }
            .app-container { width: 100%; max-width: 100%; height: 100vh; border-radius: 0; }
            .messenger-header { padding: 10px 15px; }
            h1 { font-size: 1rem; }
            .logo-icon { width: 28px; height: 28px; font-size: 1rem; }
            .profile-btn, .logout-btn { padding: 4px 8px; font-size: 0.7rem; }
            .chats-sidebar { width: 260px; position: fixed; left: -260px; top: 0; height: 100vh; z-index: 1000; transition: left 0.3s ease; background: #f5f5f5; }
            body.dark .chats-sidebar { background: #151520; }
            .chats-sidebar.open { left: 0; }
            .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
            .sidebar-overlay.open { display: block; }
            .menu-btn { display: flex; }
            .message { max-width: 85%; font-size: 0.85rem; }
            .input-area { padding: 10px 12px; gap: 8px; }
            .send-btn, .voice-btn { width: 38px; height: 38px; font-size: 1rem; }
        }
        @media (min-width: 769px) {
            .menu-btn, .sidebar-overlay { display: none; }
        }

        body.light { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body.light .app-container { background: white; }
        body.light .messenger-header { background: #2c3e50; }
        body.light .chats-sidebar { background: #f5f5f5; border-right-color: #ddd; }
        body.light .chat-item:hover { background: #e8e8e8; }
        body.light .chat-item.active { background: #3498db; color: white; }
        body.light .message.other { background: white; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        body.light .message.own { background: #3498db; color: white; }
        body.light .input-area { background: white; border-top-color: #eee; }
        body.light .input-area input { background: white; border: 1px solid #ddd; color: #333; }

        body.dark { background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%); }
        body.dark .app-container { background: #1e1e2e; }
        body.dark .messenger-header { background: #0f0f1a; }
        body.dark .chats-sidebar { background: #151520; border-right-color: #2a2a3a; }
        body.dark .chat-item { color: #ddd; }
        body.dark .chat-item:hover { background: #252535; }
        body.dark .chat-item.active { background: #3498db; color: white; }
        body.dark .message.other { background: #2a2a3a; color: #eee; }
        body.dark .message.own { background: #3498db; }
        body.dark .input-area { background: #151520; border-top-color: #2a2a3a; }
        body.dark .input-area input { background: #2a2a3a; border-color: #3a3a4a; color: white; }
        body.dark .messages-area { background: #1a1a2a; }

        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .app-container { width: 1400px; max-width: 95vw; height: 85vh; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; display: flex; flex-direction: column; }
        .messenger-header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 36px; height: 36px; background: #3498db; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: white; }
        h1 { font-size: 1.3rem; color: white; font-weight: 600; }
        .user-info { display: flex; gap: 12px; align-items: center; }
        .profile-btn, .menu-btn { background: rgba(255,255,255,0.2); border: none; padding: 6px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 0.85rem; }
        .user-badge { background: rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 20px; color: white; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .logout-btn { background: #e74c3c; border: none; padding: 6px 16px; border-radius: 20px; color: white; cursor: pointer; font-size: 0.9rem; }
        .messenger-body { display: flex; flex: 1; overflow: hidden; position: relative; }
        .chats-sidebar { width: 320px; overflow-y: auto; }
        .sidebar-section { padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
        body.dark .sidebar-section { border-color: rgba(255,255,255,0.1); }
        .section-title { padding: 0 16px 8px 16px; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; color: #888; display: flex; justify-content: space-between; align-items: center; }
        .add-channel-btn { background: #2ecc71; border: none; color: white; font-size: 1rem; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }
        .chat-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .chat-item.active { background: #3498db; color: white; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: white; background-size: cover; background-position: center; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 500; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .chat-status { font-size: 0.65rem; margin-top: 2px; opacity: 0.7; }
        .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; }
        .offline-dot { background: #7f8c8d; }
        .leave-channel, .close-chat { opacity: 0; background: none; border: none; cursor: pointer; font-size: 1rem; padding: 4px 8px; border-radius: 50%; color: inherit; }
        .chat-item:hover .leave-channel, .chat-item:hover .close-chat { opacity: 0.7; }
        .search-section { padding: 12px 16px; }
        .search-section input { width: 100%; padding: 10px 15px; border-radius: 25px; font-size: 0.9rem; outline: none; border: 1px solid #ddd; }
        .user-result { padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; }
        .start-chat-btn { background: #3498db; border: none; padding: 5px 15px; border-radius: 15px; color: white; font-size: 0.75rem; cursor: pointer; }
        .no-results { padding: 16px; text-align: center; font-size: 0.8rem; color: #999; }
        .chat-window { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; background-size: cover; background-position: center; }
        .chat-header-info h3 { font-size: 1rem; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
        .chat-header-info p { font-size: 0.65rem; opacity: 0.7; }
        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.2s ease; position: relative; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.own { align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.other { align-self: flex-start; border-bottom-left-radius: 4px; }
        .message strong { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 4px; opacity: 0.8; }
        .message small { font-size: 0.65rem; opacity: 0.6; display: block; margin-top: 5px; }
        .message-reply { font-size: 0.7rem; opacity: 0.7; margin-bottom: 5px; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,0.05); display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .message-reactions { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
        .reaction { font-size: 0.8rem; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
        .reaction-count { font-size: 0.65rem; opacity: 0.7; }
        .reaction-picker { position: fixed; z-index: 1500; background: white; border-radius: 40px; padding: 8px 12px; display: flex; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        body.dark .reaction-picker { background: #2a2a3a; }
        .reaction-option { font-size: 1.4rem; cursor: pointer; padding: 5px; border-radius: 50%; }
        .context-menu { position: fixed; background: white; border-radius: 12px; padding: 8px 0; min-width: 150px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1500; overflow: hidden; }
        body.dark .context-menu { background: #2a2a3a; color: white; }
        .context-menu-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .context-menu-item:hover { background: rgba(0,0,0,0.05); }
        .input-area { display: flex; padding: 16px 20px; gap: 12px; border-top: 1px solid rgba(0,0,0,0.1); }
        .input-area input { flex: 1; padding: 10px 16px; border-radius: 25px; font-size: 0.9rem; outline: none; }
        .send-btn, .voice-btn { background: #3498db; border: none; width: 44px; border-radius: 25px; cursor: pointer; color: white; font-size: 1.2rem; transition: 0.2s; }
        .voice-btn { background: #2ecc71; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .sidebar-overlay.open { display: block; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-content { width: 450px; max-width: 90%; border-radius: 20px; padding: 25px; animation: modalFade 0.3s ease; max-height: 90vh; overflow-y: auto; }
        body.light .modal-content { background: white; }
        body.dark .modal-content { background: #1e1e2e; color: #eee; }
        @keyframes modalFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; outline: none; border: 1px solid #ddd; }
        body.dark .form-group input, body.dark .form-group select { background: #2a2a3a; border-color: #3a3a4a; color: white; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 500; }
        .save-btn { background: #3498db; color: white; }
        .cancel-btn { background: #e74c3c; color: white; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background-size: cover; background-position: center; margin: 0 auto 15px; background-color: #3498db; }
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: white; width: 380px; max-width: 90%; border-radius: 16px; padding: 35px; text-align: center; }
        body.dark .auth-card { background: #1e1e2e; color: #eee; }
        .auth-card h2 { margin-bottom: 25px; }
        .auth-card input { width: 100%; margin: 10px 0; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        body.dark .auth-card input { background: #2a2a3a; border-color: #3a3a4a; color: white; }
        .auth-card button { background: #3498db; border: none; padding: 12px; margin-top: 15px; width: 100%; border-radius: 8px; color: white; cursor: pointer; }
        .switch-auth { margin-top: 15px; color: #3498db; cursor: pointer; }
        .error-msg { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; }
        .empty-state { text-align: center; padding: 40px; opacity: 0.6; }
        .online-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; margin-left: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="light">

<div class="app-container" id="appContainer" style="display: none;">
    <div class="messenger-header">
        <div class="logo-area">
            <button class="menu-btn" id="menuBtn">☰</button>
            <div class="logo-icon">💬</div>
            <h1>Nexus Chat</h1>
        </div>
        <div class="user-info">
            <button class="profile-btn" id="profileBtn">👤 Профиль</button>
            <span class="user-badge" id="currentUserDisplay">—</span>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
    </div>
    <div class="messenger-body">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="chats-sidebar" id="chatsSidebar"></div>
        <div class="chat-window">
            <div class="chat-header" id="chatHeader"></div>
            <div class="messages-area" id="messagesArea">
                <div class="empty-state">💬 Выберите чат</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off" enterkeyhint="send">
                <button class="voice-btn" id="voiceBtn">🎤</button>
                <button class="send-btn" id="sendMsgBtn">📤</button>
            </div>
        </div>
    </div>
</div>

<div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
        <h2>Добро пожаловать</h2>
        <input type="text" id="authUsername" placeholder="Имя пользователя" autocomplete="off">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="submitAuthBtn">Войти</button>
        <div class="switch-auth" id="switchModeBtn">Создать аккаунт</div>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<script>
    // ========== ПОЛНОСТЬЮ РАБОЧИЙ МЕССЕНДЖЕР ==========
    let users = [];
    let messages = [];
    let customChannels = [];
    let privateChats = [];
    let userSubscriptions = {};
    let onlineUsers = {};
    let currentUser = null;
    let currentChat = { type: "channel", id: "general" };
    let isLoginMode = true;
    let replyToMessageId = null;

    const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "🔥", "🎉", "👏"];
    const DEFAULT_CHANNELS = [
        { id: "general", name: "💬 Общий чат", desc: "Все пользователи", emoji: "💬", creator: "system", isDefault: true },
        { id: "news", name: "📰 Новости", desc: "Главные события", emoji: "📰", creator: "system", isDefault: true },
        { id: "gaming", name: "🎮 Игры", desc: "Обсуждение игр", emoji: "🎮", creator: "system", isDefault: true },
        { id: "music", name: "🎵 Музыка", desc: "Новинки и треки", emoji: "🎵", creator: "system", isDefault: true },
        { id: "random", name: "🎲 Случайный", desc: "Обо всём", emoji: "🎲", creator: "system", isDefault: true }
    ];

    const AVATAR_COLORS = ["#3498db", "#e74c3c", "#2ecc71", "#f39c12", "#9b59b6", "#1abc9c", "#e67e22", "#34495e"];

    // Загрузка данных
    function loadData() {
        users = JSON.parse(localStorage.getItem("chat_users") || "[]");
        messages = JSON.parse(localStorage.getItem("chat_messages") || "[]");
        customChannels = JSON.parse(localStorage.getItem("chat_custom_channels") || "[]");
        privateChats = JSON.parse(localStorage.getItem("chat_private_chats") || "[]");
        userSubscriptions = JSON.parse(localStorage.getItem("chat_subscriptions") || "{}");
        onlineUsers = JSON.parse(localStorage.getItem("chat_online") || "{}");
        const savedTheme = localStorage.getItem("chat_theme");
        if (savedTheme) document.body.className = savedTheme;
    }

    function saveAll() {
        localStorage.setItem("chat_users", JSON.stringify(users));
        localStorage.setItem("chat_messages", JSON.stringify(messages));
        localStorage.setItem("chat_custom_channels", JSON.stringify(customChannels));
        localStorage.setItem("chat_private_chats", JSON.stringify(privateChats));
        localStorage.setItem("chat_subscriptions", JSON.stringify(userSubscriptions));
        localStorage.setItem("chat_online", JSON.stringify(onlineUsers));
    }

    // Вспомогательные функции
    function getAllChannels() { return [...DEFAULT_CHANNELS, ...customChannels]; }
    function getChannelById(id) { return getAllChannels().find(c => c.id === id); }

    function getUserSubscribedChannels(username) {
        if (!userSubscriptions[username]) {
            userSubscriptions[username] = DEFAULT_CHANNELS.map(c => c.id);
            saveAll();
        }
        return userSubscriptions[username];
    }

    function getUserProfile(username) {
        const user = users.find(u => u.name === username);
        if (user && !user.profile) {
            user.profile = { avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)], avatarEmoji: "😀", avatarImage: null, statusText: "В чате" };
            saveAll();
        }
        return user?.profile || { avatarColor: "#3498db", avatarEmoji: "😀", avatarImage: null, statusText: "В чате" };
    }

    function getAvatarHtml(profile, size = 40) {
        if (profile.avatarImage) {
            return `<img style="width: ${size}px; height: ${size}px; border-radius: 50%; object-fit: cover;" src="${profile.avatarImage}">`;
        } else {
            return `<div style="background: ${profile.avatarColor}; width: ${size}px; height: ${size}px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: ${size/2}px; color: white;">${profile.avatarEmoji}</div>`;
        }
    }

    function isUserOnline(username) {
        return onlineUsers[username] && (Date.now() - onlineUsers[username]) < 30000;
    }

    function updateOnlineStatus() {
        if (currentUser) {
            onlineUsers[currentUser] = Date.now();
            saveAll();
        }
    }

    // Отправка сообщения
    function sendMessage(text) {
        if (!text.trim()) return;
        if (!currentUser) return;
        
        if (currentChat.type === "channel") {
            const subs = getUserSubscribedChannels(currentUser);
            if (!subs.includes(currentChat.id)) {
                alert("Вы не подписаны на этот канал. Найдите его в поиске и подпишитесь.");
                return;
            }
        }
        
        const message = {
            id: Date.now() + "_" + Math.random().toString(36).substr(2, 8),
            type: currentChat.type,
            msgType: "text",
            from: currentUser,
            text: text.trim(),
            time: Date.now()
        };
        
        if (replyToMessageId) {
            const originalMsg = messages.find(m => m.id === replyToMessageId);
            if (originalMsg) {
                message.replyTo = {
                    id: originalMsg.id,
                    from: originalMsg.from,
                    text: originalMsg.text?.substring(0, 80) || "Сообщение"
                };
            }
            replyToMessageId = null;
            document.getElementById("messageInput").placeholder = "Введите сообщение...";
        }
        
        if (currentChat.type === "channel") {
            message.channel = currentChat.id;
        } else {
            message.chatId = currentChat.id;
        }
        
        messages.push(message);
        saveAll();
        renderMessages();
        
        const area = document.getElementById("messagesArea");
        if (area) setTimeout(() => { area.scrollTop = area.scrollHeight; }, 100);
    }

    // Реакции
    function addReaction(messageId, reaction) {
        const msg = messages.find(m => m.id === messageId);
        if (!msg) return;
        if (!msg.reactions) msg.reactions = {};
        if (!msg.reactions[reaction]) msg.reactions[reaction] = [];
        
        const idx = msg.reactions[reaction].indexOf(currentUser);
        if (idx !== -1) {
            msg.reactions[reaction].splice(idx, 1);
            if (msg.reactions[reaction].length === 0) delete msg.reactions[reaction];
        } else {
            msg.reactions[reaction].push(currentUser);
        }
        saveAll();
        renderMessages();
    }

    // Ответ на сообщение
    function replyToMessage(messageId) {
        const msg = messages.find(m => m.id === messageId);
        if (msg) {
            replyToMessageId = messageId;
            const input = document.getElementById("messageInput");
            const preview = msg.text?.substring(0, 50) || "Сообщение";
            input.placeholder = `↩️ Ответ ${msg.from}: ${preview}${msg.text?.length > 50 ? '...' : ''}`;
            input.focus();
        }
    }

    // Пересылка
    function forwardMessage(messageId) {
        const msg = messages.find(m => m.id === messageId);
        if (!msg) return;
        
        const newMsg = {
            id: Date.now() + "_" + Math.random().toString(36).substr(2, 8),
            type: currentChat.type,
            msgType: "text",
            from: currentUser,
            text: `📎 Переслано от ${msg.from}: ${msg.text}`,
            time: Date.now()
        };
        
        if (currentChat.type === "channel") {
            newMsg.channel = currentChat.id;
        } else {
            newMsg.chatId = currentChat.id;
        }
        
        messages.push(newMsg);
        saveAll();
        renderMessages();
        setTimeout(() => { const area = document.getElementById("messagesArea"); if (area) area.scrollTop = area.scrollHeight; }, 100);
    }

    // Рендер сообщений
    function renderMessages() {
        const area = document.getElementById("messagesArea");
        if (!area) return;
        
        let chatMessages = messages.filter(m => {
            if (currentChat.type === "channel") return m.type === "channel" && m.channel === currentChat.id;
            return m.type === "private" && m.chatId === currentChat.id;
        });
        chatMessages.sort((a, b) => a.time - b.time);
        
        if (chatMessages.length === 0) {
            area.innerHTML = '<div class="empty-state">✨ Нет сообщений. Напишите первым!</div>';
            return;
        }
        
        area.innerHTML = chatMessages.map(msg => {
            const isMine = currentUser === msg.from;
            const time = new Date(msg.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const profile = getUserProfile(msg.from);
            
            let replyHtml = '';
            if (msg.replyTo) {
                replyHtml = `<div class="message-reply">↩️ <span>${escapeHtml(msg.replyTo.from)}</span>: ${escapeHtml(msg.replyTo.text)}</div>`;
            }
            
            let reactionsHtml = '';
            if (msg.reactions && Object.keys(msg.reactions).length > 0) {
                reactionsHtml = '<div class="message-reactions">';
                for (const [emoji, usersList] of Object.entries(msg.reactions)) {
                    reactionsHtml += `<span class="reaction" data-emoji="${emoji}">${emoji} <span class="reaction-count">${usersList.length}</span></span>`;
                }
                reactionsHtml += '</div>';
            }
            
            return `
                <div class="message ${isMine ? 'own' : 'other'}" data-message-id="${msg.id}">
                    <strong>${getAvatarHtml(profile, 20)} ${escapeHtml(msg.from)}</strong>
                    ${replyHtml}
                    <div>${escapeHtml(msg.text)}</div>
                    ${reactionsHtml}
                    <small>${time}</small>
                </div>
            `;
        }).join('');
        
        // Обработчики для сообщений
        document.querySelectorAll('.message').forEach(el => {
            const msgId = el.dataset.messageId;
            let clickTimer = null;
            
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('reaction')) {
                    const emoji = e.target.closest('.reaction')?.dataset.emoji;
                    if (emoji) addReaction(msgId, emoji);
                    return;
                }
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                    showReactionPicker(e, msgId);
                } else {
                    clickTimer = setTimeout(() => { clickTimer = null; }, 200);
                }
            });
            
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(e, msgId);
            });
            
            let pressTimer = null;
            el.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => { showContextMenu(e, msgId); pressTimer = null; }, 500);
            });
            el.addEventListener('touchend', () => { if (pressTimer) clearTimeout(pressTimer); });
        });
        
        const isScrolledToBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 100;
        if (isScrolledToBottom) area.scrollTop = area.scrollHeight;
    }

    function showReactionPicker(event, messageId) {
        const existing = document.querySelector('.reaction-picker');
        if (existing) existing.remove();
        
        const picker = document.createElement('div');
        picker.className = 'reaction-picker';
        picker.innerHTML = REACTIONS.map(r => `<span class="reaction-option" data-reaction="${r}">${r}</span>`).join('');
        picker.style.position = 'fixed';
        picker.style.top = `${event.clientY - 50}px`;
        picker.style.left = `${event.clientX - 100}px`;
        document.body.appendChild(picker);
        
        picker.querySelectorAll('.reaction-option').forEach(opt => {
            opt.onclick = () => { addReaction(messageId, opt.dataset.reaction); picker.remove(); };
        });
        
        setTimeout(() => {
            document.addEventListener('click', function close(e) { if (!picker.contains(e.target)) { picker.remove(); document.removeEventListener('click', close); } });
        }, 10);
    }

    function showContextMenu(event, messageId) {
        const existing = document.querySelector('.context-menu');
        if (existing) existing.remove();
        
        const menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.innerHTML = `<div class="context-menu-item" data-action="reply">↩️ Ответить</div><div class="context-menu-item" data-action="forward">📤 Переслать</div>`;
        menu.style.position = 'fixed';
        menu.style.top = `${event.clientY}px`;
        menu.style.left = `${event.clientX}px`;
        document.body.appendChild(menu);
        
        menu.querySelectorAll('.context-menu-item').forEach(item => {
            item.onclick = () => {
                if (item.dataset.action === 'reply') replyToMessage(messageId);
                else if (item.dataset.action === 'forward') forwardMessage(messageId);
                menu.remove();
            };
        });
        
        setTimeout(() => {
            document.addEventListener('click', function close(e) { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', close); } });
        }, 10);
    }

    // Рендер сайдбара
    function renderSidebar() {
        const container = document.getElementById("chatsSidebar");
        if (!container) return;
        
        const subscribed = getUserSubscribedChannels(currentUser);
        const allChannels = getAllChannels();
        const myChannels = allChannels.filter(ch => subscribed.includes(ch.id));
        
        let html = `<div class="sidebar-section"><div class="section-title">📡 МОИ КАНАЛЫ (${myChannels.length})<button class="add-channel-btn" id="addChannelBtn">+</button></div>`;
        html += myChannels.map(ch => `<div class="chat-item ${currentChat.type === 'channel' && currentChat.id === ch.id ? 'active' : ''}" data-type="channel" data-id="${ch.id}"><div class="chat-avatar" style="background: #3498db;">${ch.emoji}</div><div class="chat-info"><div class="chat-name">${escapeHtml(ch.name)}</div><div class="chat-status">${ch.desc}</div></div>${!ch.isDefault ? `<button class="leave-channel" data-channel-leave="${ch.id}">🚪</button>` : ''}</div>`).join('');
        if (myChannels.length === 0) html += '<div class="no-results">Нет подписок. Найдите каналы через поиск!</div>';
        html += `</div>`;
        
        const myPrivateChats = privateChats.filter(c => c.user1 === currentUser || c.user2 === currentUser);
        html += `<div class="sidebar-section"><div class="section-title">💬 ЛИЧНЫЕ СООБЩЕНИЯ (${myPrivateChats.length})</div>`;
        html += myPrivateChats.map(chat => {
            const other = chat.user1 === currentUser ? chat.user2 : chat.user1;
            const profile = getUserProfile(other);
            const isOnline = isUserOnline(other);
            return `<div class="chat-item ${currentChat.type === 'private' && currentChat.id === chat.id ? 'active' : ''}" data-type="private" data-id="${chat.id}" data-other="${other}">${getAvatarHtml(profile, 40)}<div class="chat-info"><div class="chat-name">${escapeHtml(other)}${isOnline ? '<span class="online-dot"></span>' : '<span class="offline-dot"></span>'}</div><div class="chat-status">${profile.statusText}</div></div><button class="close-chat" data-private-leave="${chat.id}">🗑️</button></div>`;
        }).join('');
        if (myPrivateChats.length === 0) html += '<div class="no-results">Нет личных чатов. Найдите людей в поиске!</div>';
        html += `</div>`;
        
        const otherUsers = users.filter(u => u.name !== currentUser);
        html += `<div class="sidebar-section"><div class="section-title">🔍 ПОИСК ЛЮДЕЙ</div><div class="search-section"><input type="text" id="searchUsers" placeholder="Поиск по имени..."></div><div id="userSearchResults"><div class="no-results">Введите имя для поиска</div></div></div>`;
        
        container.innerHTML = html;
        
        // Обработчики каналов
        document.querySelectorAll('.chat-item[data-type="channel"]').forEach(el => {
            el.onclick = (e) => {
                if (e.target.classList.contains('leave-channel')) return;
                currentChat = { type: "channel", id: el.dataset.id };
                renderSidebar();
                renderMessages();
                updateChatHeader();
                if (window.innerWidth <= 768) closeSidebar();
            };
        });
        
        document.querySelectorAll('.leave-channel').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const channelId = btn.dataset.channelLeave;
                const channel = getChannelById(channelId);
                if (confirm(`Отписаться от канала "${channel?.name}"?`)) {
                    const subs = getUserSubscribedChannels(currentUser);
                    userSubscriptions[currentUser] = subs.filter(id => id !== channelId);
                    saveAll();
                    renderSidebar();
                    if (currentChat.type === 'channel' && currentChat.id === channelId) {
                        currentChat = { type: "channel", id: "general" };
                        renderMessages();
                        updateChatHeader();
                    }
                }
            };
        });
        
        // Обработчики личных чатов
        document.querySelectorAll('.chat-item[data-type="private"]').forEach(el => {
            el.onclick = (e) => {
                if (e.target.classList.contains('close-chat')) return;
                currentChat = { type: "private", id: el.dataset.id, otherUser: el.dataset.other };
                renderSidebar();
                renderMessages();
                updateChatHeader();
                if (window.innerWidth <= 768) closeSidebar();
            };
        });
        
        document.querySelectorAll('.close-chat').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                if (confirm("Закрыть этот чат? История будет удалена.")) {
                    privateChats = privateChats.filter(c => c.id !== btn.dataset.privateLeave);
                    messages = messages.filter(m => !(m.type === "private" && m.chatId === btn.dataset.privateLeave));
                    saveAll();
                    if (currentChat.type === "private" && currentChat.id === btn.dataset.privateLeave) {
                        currentChat = { type: "channel", id: "general" };
                        renderMessages();
                        updateChatHeader();
                    }
                    renderSidebar();
                }
            };
        });
        
        // Поиск пользователей
        const searchInput = document.getElementById("searchUsers");
        if (searchInput) {
            searchInput.oninput = (e) => {
                const query = e.target.value.toLowerCase();
                const results = otherUsers.filter(u => u.name.toLowerCase().includes(query));
                const resultsDiv = document.getElementById("userSearchResults");
                if (!query) resultsDiv.innerHTML = '<div class="no-results">Введите имя для поиска</div>';
                else if (results.length === 0) resultsDiv.innerHTML = '<div class="no-results">👤 Пользователей не найдено</div>';
                else {
                    resultsDiv.innerHTML = results.map(user => {
                        const profile = getUserProfile(user.name);
                        const isOnline = isUserOnline(user.name);
                        return `<div class="user-result" data-name="${user.name}"><div style="width: 36px; height: 36px; border-radius: 50%; background: ${profile.avatarColor}; display: flex; align-items: center; justify-content: center;">${profile.avatarEmoji}</div><div style="flex:1">${escapeHtml(user.name)}${isOnline ? ' 🟢' : ' ⚫'}</div><button class="start-chat-btn" data-user="${user.name}">Написать</button></div>`;
                    }).join('');
                    document.querySelectorAll('.start-chat-btn').forEach(btn => {
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            let chat = privateChats.find(c => (c.user1 === currentUser && c.user2 === btn.dataset.user) || (c.user1 === btn.dataset.user && c.user2 === currentUser));
                            if (!chat) {
                                chat = { id: "priv_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6), user1: currentUser, user2: btn.dataset.user, createdAt: Date.now() };
                                privateChats.push(chat);
                                saveAll();
                            }
                            currentChat = { type: "private", id: chat.id, otherUser: btn.dataset.user };
                            renderSidebar();
                            renderMessages();
                            updateChatHeader();
                            if (window.innerWidth <= 768) closeSidebar();
                        };
                    });
                }
            };
        }
        
        // Кнопка создания канала
        const addBtn = document.getElementById("addChannelBtn");
        if (addBtn) addBtn.onclick = () => showCreateChannelModal();
    }

    function showCreateChannelModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h2>📡 Создать канал</h2><div class="form-group"><label>Название</label><input type="text" id="channelName" placeholder="Название канала"></div><div class="form-group"><label>Описание</label><input type="text" id="channelDesc" placeholder="Описание"></div><div class="modal-buttons"><button class="save-btn" id="createBtn">Создать</button><button class="cancel-btn" id="cancelBtn">Отмена</button></div></div>`;
        document.body.appendChild(modal);
        
        document.getElementById('createBtn').onclick = () => {
            const name = document.getElementById('channelName').value.trim();
            if (!name) { alert("Введите название"); return; }
            const desc = document.getElementById('channelDesc').value.trim();
            const emojis = ["🔥", "⭐", "💎", "🍕", "🎬", "⚽", "🏀", "📷", "✈️", "🌍", "💻", "🎨"];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const id = "custom_" + Date.now() + "_" + Math.random().toString(36).substr(2, 8);
            customChannels.push({ id, name: `${emoji} ${name}`, desc: desc || "Пользовательский канал", emoji: emoji, creator: currentUser, isDefault: false });
            
            const subs = getUserSubscribedChannels(currentUser);
            subs.push(id);
            userSubscriptions[currentUser] = subs;
            
            saveAll();
            currentChat = { type: "channel", id: id };
            renderSidebar();
            renderMessages();
            updateChatHeader();
            modal.remove();
            if (window.innerWidth <= 768) closeSidebar();
        };
        document.getElementById('cancelBtn').onclick = () => modal.remove();
    }

    function updateChatHeader() {
        const header = document.getElementById("chatHeader");
        if (currentChat.type === "channel") {
            const ch = getChannelById(currentChat.id);
            if (ch) header.innerHTML = `<div class="chat-header-avatar" style="background: #3498db;">${ch.emoji}</div><div class="chat-header-info"><h3>${ch.name}</h3><p>${ch.desc}</p></div>`;
        } else {
            const profile = getUserProfile(currentChat.otherUser);
            const isOnline = isUserOnline(currentChat.otherUser);
            header.innerHTML = `<div class="chat-header-avatar" style="background: ${profile.avatarColor};">${profile.avatarEmoji}</div><div class="chat-header-info"><h3>${escapeHtml(currentChat.otherUser)} ${isOnline ? '<span class="online-indicator"></span>' : ''}</h3><p>${profile.statusText}</p></div>`;
        }
    }

    function showProfileModal() {
        const profile = getUserProfile(currentUser);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h2>👤 Профиль</h2><div class="avatar-preview" id="avatarPreview" style="background: ${profile.avatarColor};">${profile.avatarEmoji}</div><input type="file" id="avatarUpload" style="display:none"><button class="upload-btn" id="uploadAvatarBtn">📷 Загрузить аватар</button><div class="form-group"><label>Статус</label><input type="text" id="statusText" value="${profile.statusText}"></div><div class="form-group"><label>Тема</label><select id="themeSelect"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div><div class="modal-buttons"><button class="save-btn" id="saveProfileBtn">Сохранить</button><button class="cancel-btn" id="closeModalBtn">Отмена</button></div></div>`;
        document.body.appendChild(modal);
        
        document.getElementById('themeSelect').value = document.body.className;
        document.getElementById('uploadAvatarBtn').onclick = () => document.getElementById('avatarUpload').click();
        document.getElementById('avatarUpload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const user = users.find(u => u.name === currentUser);
                    user.profile.avatarImage = ev.target.result;
                    user.profile.avatarColor = null;
                    user.profile.avatarEmoji = null;
                    saveAll();
                    document.getElementById('avatarPreview').style.backgroundImage = `url(${ev.target.result})`;
                    document.getElementById('avatarPreview').style.backgroundSize = 'cover';
                    document.getElementById('avatarPreview').innerHTML = '';
                    updateUIAfterProfileChange();
                };
                reader.readAsDataURL(file);
            }
        };
        document.getElementById('saveProfileBtn').onclick = () => {
            const newTheme = document.getElementById('themeSelect').value;
            const newStatus = document.getElementById('statusText').value;
            const user = users.find(u => u.name === currentUser);
            user.profile.statusText = newStatus || "В чате";
            saveAll();
            document.body.className = newTheme;
            localStorage.setItem("chat_theme", newTheme);
            updateUIAfterProfileChange();
            modal.remove();
        };
        document.getElementById('closeModalBtn').onclick = () => modal.remove();
    }

    function updateUIAfterProfileChange() {
        const profile = getUserProfile(currentUser);
        document.getElementById("currentUserDisplay").innerHTML = `${getAvatarHtml(profile, 24)} ${currentUser} <span class="online-indicator"></span>`;
        renderSidebar();
        updateChatHeader();
    }

    // Синхронизация
    let syncInterval = null;
    function startSync() {
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(() => {
            const newMessages = JSON.parse(localStorage.getItem("chat_messages") || "[]");
            if (JSON.stringify(newMessages) !== JSON.stringify(messages)) { messages = newMessages; renderMessages(); }
            const newUsers = JSON.parse(localStorage.getItem("chat_users") || "[]");
            if (JSON.stringify(newUsers) !== JSON.stringify(users)) { users = newUsers; renderSidebar(); }
            const newPrivate = JSON.parse(localStorage.getItem("chat_private_chats") || "[]");
            if (JSON.stringify(newPrivate) !== JSON.stringify(privateChats)) { privateChats = newPrivate; renderSidebar(); }
            const newSubs = JSON.parse(localStorage.getItem("chat_subscriptions") || "{}");
            if (JSON.stringify(newSubs) !== JSON.stringify(userSubscriptions)) { userSubscriptions = newSubs; renderSidebar(); updateChatHeader(); }
            const newOnline = JSON.parse(localStorage.getItem("chat_online") || "{}");
            if (JSON.stringify(newOnline) !== JSON.stringify(onlineUsers)) { onlineUsers = newOnline; renderSidebar(); updateChatHeader(); }
        }, 500);
        
        window.addEventListener('storage', (event) => {
            if (event.key === 'chat_messages' && event.newValue) { messages = JSON.parse(event.newValue); renderMessages(); }
            if (event.key === 'chat_users' && event.newValue) { users = JSON.parse(event.newValue); renderSidebar(); }
            if (event.key === 'chat_online' && event.newValue) { onlineUsers = JSON.parse(event.newValue); renderSidebar(); updateChatHeader(); }
        });
    }

    // Аутентификация
    function register(name, pass) {
        if (!name.trim() || !pass.trim()) return "Заполните все поля";
        if (users.find(u => u.name === name)) return "Пользователь уже существует";
        users.push({ name, pass, profile: { avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)], avatarEmoji: "😀", avatarImage: null, statusText: "В чате" } });
        userSubscriptions[name] = DEFAULT_CHANNELS.map(c => c.id);
        saveAll();
        return true;
    }

    function login(name, pass) {
        const user = users.find(u => u.name === name && u.pass === pass);
        if (!user) return "Неверное имя или пароль";
        return user;
    }

    let activityInterval = null;
    function startActivityTracking() {
        if (activityInterval) clearInterval(activityInterval);
        activityInterval = setInterval(() => updateOnlineStatus(), 5000);
        window.addEventListener('click', updateOnlineStatus);
        window.addEventListener('keypress', updateOnlineStatus);
        window.addEventListener('touchstart', updateOnlineStatus);
    }

    function setupApp() {
        updateOnlineStatus();
        startActivityTracking();
        renderSidebar();
        renderMessages();
        updateChatHeader();
        startSync();
        
        document.getElementById("profileBtn").onclick = () => showProfileModal();
        document.getElementById("sendMsgBtn").onclick = () => {
            const input = document.getElementById("messageInput");
            sendMessage(input.value);
            input.value = "";
        };
        document.getElementById("messageInput").onkeypress = (e) => {
            if (e.key === "Enter") {
                const input = document.getElementById("messageInput");
                sendMessage(input.value);
                input.value = "";
            }
        };
        
        document.getElementById("voiceBtn").onclick = () => { alert("🎤 Голосовые сообщения будут доступны в следующей версии!"); };
        
        document.getElementById("logoutBtn").onclick = () => {
            if (syncInterval) clearInterval(syncInterval);
            if (activityInterval) clearInterval(activityInterval);
            if (currentUser) { onlineUsers[currentUser] = 0; saveAll(); }
            currentUser = null;
            document.getElementById("appContainer").style.display = "none";
            document.getElementById("authOverlay").style.display = "flex";
            isLoginMode = true;
            updateAuthUI();
        };
        
        const menuBtn = document.getElementById("menuBtn");
        const overlay = document.getElementById("sidebarOverlay");
        if (menuBtn) menuBtn.onclick = () => toggleSidebar();
        if (overlay) overlay.onclick = () => closeSidebar();
    }
    
    function toggleSidebar() {
        document.getElementById('chatsSidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('open');
    }
    function closeSidebar() {
        document.getElementById('chatsSidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    }

    function updateAuthUI() {
        const title = document.querySelector(".auth-card h2");
        const btn = document.getElementById("submitAuthBtn");
        const switchBtn = document.getElementById("switchModeBtn");
        if (isLoginMode) { title.innerHTML = "Вход в чат"; btn.innerText = "Войти"; switchBtn.innerText = "Создать аккаунт"; }
        else { title.innerHTML = "Регистрация"; btn.innerText = "Зарегистрироваться"; switchBtn.innerText = "Уже есть аккаунт? Войти"; }
    }

    function handleAuth() {
        const name = document.getElementById("authUsername").value.trim();
        const pass = document.getElementById("authPassword").value.trim();
        const errorDiv = document.getElementById("authError");
        errorDiv.innerText = "";
        if (!name || !pass) { errorDiv.innerText = "Заполните все поля"; return; }
        
        if (isLoginMode) {
            const result = login(name, pass);
            if (typeof result === "string") errorDiv.innerText = result;
            else {
                currentUser = name;
                const profile = getUserProfile(currentUser);
                document.getElementById("currentUserDisplay").innerHTML = `${getAvatarHtml(profile, 24)} ${name} <span class="online-indicator"></span>`;
                document.getElementById("appContainer").style.display = "flex";
                document.getElementById("authOverlay").style.display = "none";
                setupApp();
            }
        } else {
            const result = register(name, pass);
            if (result === true) {
                errorDiv.innerText = "✅ Аккаунт создан! Теперь войдите.";
                isLoginMode = true;
                updateAuthUI();
                document.getElementById("authPassword").value = "";
            } else errorDiv.innerText = result;
        }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

    function init() {
        loadData();
        updateAuthUI();
        document.getElementById("submitAuthBtn").onclick = () => handleAuth();
        document.getElementById("switchModeBtn").onclick = () => { isLoginMode = !isLoginMode; updateAuthUI(); document.getElementById("authError").innerText = ""; };
    }
    init();
</script>
</body>
</html>
