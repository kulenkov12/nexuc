<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nexus Chat | QR Донаты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body.light { background: #f5f5f7; }
        body.light .app-container { background: white; }
        body.light .messenger-header { background: white; border-bottom: 1px solid #e9ecef; }
        body.light h1, body.light .logo-icon { color: #1a1a2e; }
        body.light .logo-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
        body.light .user-badge { background: #f0f2f5; color: #1a1a2e; }
        body.light .logout-btn { background: #fee2e2; color: #dc2626; }
        body.light .message.other { background: #f0f2f5; color: #1a1a2e; }
        body.light .message.own { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        body.light .input-area { background: white; border-top: 1px solid #e9ecef; }
        body.light .input-area input { background: #f0f2f5; border: none; color: #1a1a2e; }
        body.light .nav-bar { background: white; border-top: 1px solid #e9ecef; }
        body.light .nav-item { color: #8e9aaf; }
        body.light .nav-item.active { color: #667eea; }
        body.light .list-item { background: white; }
        body.light .list-item:hover { background: #f0f2f5; }
        body.light .section-title { color: #8e9aaf; }
        body.light .search-box input { background: #f0f2f5; border: none; }
        body.light .recent-item { background: #f8f9fa; }
        body.light .admin-panel { background: #fef3c7; border: 1px solid #f59e0b; }
        body.light .admin-btn { background: #f59e0b; color: #1f2937; }
        body.light .donate-card { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }

        body.dark { background: #121212; }
        body.dark .app-container { background: #1e1e2e; }
        body.dark .messenger-header { background: #1e1e2e; border-bottom: 1px solid #2a2a3a; }
        body.dark h1, body.dark .logo-icon { color: #ffffff; }
        body.dark .logo-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
        body.dark .user-badge { background: #2a2a3a; color: #e0e0e0; }
        body.dark .logout-btn { background: #3a1a1a; color: #ff6b6b; }
        body.dark .message.other { background: #2a2a3a; color: #e0e0e0; }
        body.dark .message.own { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        body.dark .input-area { background: #1e1e2e; border-top: 1px solid #2a2a3a; }
        body.dark .input-area input { background: #2a2a3a; border: none; color: #e0e0e0; }
        body.dark .nav-bar { background: #1e1e2e; border-top: 1px solid #2a2a3a; }
        body.dark .nav-item { color: #6c6c8a; }
        body.dark .nav-item.active { color: #a78bfa; }
        body.dark .list-item { background: #1e1e2e; color: #e0e0e0; }
        body.dark .list-item:hover { background: #2a2a3a; }
        body.dark .section-title { color: #6c6c8a; }
        body.dark .search-box input { background: #2a2a3a; border: none; color: #e0e0e0; }
        body.dark .recent-item { background: #252535; }
        body.dark .admin-panel { background: #2d2d1a; border: 1px solid #f59e0b; }
        body.dark .admin-btn { background: #f59e0b; color: #1f2937; }
        body.dark .message.deleted { background: #2a2a3a; color: #666; font-style: italic; }
        body.light .message.deleted { background: #e9ecef; color: #999; font-style: italic; }

        body.hockey { background: linear-gradient(135deg, #0a2a3a 0%, #1a4a5a 100%); }
        body.hockey .app-container { background: rgba(10, 25, 35, 0.9); backdrop-filter: blur(5px); border: 2px solid #ffd700; }
        body.hockey .messenger-header { background: #0d1f2a; border-bottom: 2px solid #ffd700; }
        body.hockey h1, body.hockey .logo-icon { color: #ffd700; }
        body.hockey .logo-icon { background: #2c3e50; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        body.hockey .user-badge { background: #1a3a4a; color: #ffd700; border: 1px solid #ffd700; }
        body.hockey .logout-btn { background: #8b0000; color: #ffd700; }
        body.hockey .message.other { background: #1a3a4a; color: #e0e0e0; border-left: 4px solid #ffd700; }
        body.hockey .message.own { background: linear-gradient(135deg, #2c3e50, #1a3a4a); color: #ffd700; border-right: 4px solid #ffd700; }
        body.hockey .input-area { background: #0d1f2a; border-top: 1px solid #ffd700; }
        body.hockey .input-area input { background: #1a3a4a; border: none; color: #ffd700; }
        body.hockey .nav-bar { background: #0d1f2a; border-top: 1px solid #ffd700; }
        body.hockey .nav-item { color: #8e9aaf; }
        body.hockey .nav-item.active { color: #ffd700; }
        body.hockey .list-item { background: #1a3a4a; color: #e0e0e0; border-bottom: 1px solid #ffd70040; }
        body.hockey .list-item:hover { background: #2a4a5a; }
        body.hockey .section-title { color: #ffd700; }

        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .app-container { width: 1300px; max-width: 100%; height: 85vh; border-radius: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; }
        .messenger-header { padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.3px; }
        .user-info { display: flex; gap: 12px; align-items: center; }
        .user-badge { padding: 6px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .logout-btn { padding: 6px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; }
        .main-content { flex: 1; display: flex; overflow: hidden; }
        .tab-content { display: none; flex: 1; overflow-y: auto; }
        .tab-content.active { display: block; }
        .chat-area { display: flex; flex-direction: column; height: 100%; }
        .chat-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .chat-header-left { display: flex; align-items: center; gap: 14px; }
        .chat-header-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background-size: cover; }
        .chat-header-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .chat-header-info p { font-size: 0.7rem; opacity: 0.65; }
        .call-buttons { display: flex; gap: 12px; }
        .call-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 22px; font-size: 0.9rem; line-height: 1.4; animation: fadeIn 0.2s ease; cursor: pointer; position: relative; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.own { align-self: flex-end; border-bottom-right-radius: 6px; }
        .message.other { align-self: flex-start; border-bottom-left-radius: 6px; }
        .message strong { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 5px; opacity: 0.8; }
        .message small { font-size: 0.65rem; opacity: 0.6; display: block; margin-top: 6px; }
        .message-reply { font-size: 0.7rem; opacity: 0.7; margin-bottom: 6px; padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,0.05); display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .message-reactions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .reaction { font-size: 0.75rem; background: rgba(0,0,0,0.06); padding: 3px 8px; border-radius: 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .message-image { max-width: 250px; max-height: 250px; border-radius: 16px; margin-top: 5px; cursor: pointer; }
        .message-video { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; margin-top: 5px; cursor: pointer; border: 2px solid; }
        .input-area { display: flex; padding: 14px 20px; gap: 12px; align-items: center; }
        .input-area input { flex: 1; padding: 12px 18px; border-radius: 30px; font-size: 0.9rem; outline: none; }
        .attach-btn { background: #95a5a6; border: none; width: 48px; height: 48px; border-radius: 30px; cursor: pointer; font-size: 1.2rem; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
        .circle-btn { background: #e74c3c; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
        .circle-btn.recording { background: #c0392b; animation: pulse 0.5s infinite; }
        .send-btn, .voice-btn { width: 48px; height: 48px; border-radius: 30px; border: none; cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .send-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .voice-btn { background: #2ecc71; color: white; }
        .donate-btn { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .nav-bar { display: flex; justify-content: space-around; padding: 8px 20px 12px; border-top: 1px solid; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; padding: 6px 16px; border-radius: 30px; transition: all 0.2s; font-size: 0.7rem; font-weight: 500; }
        .nav-item .nav-icon { font-size: 1.4rem; }
        .nav-item.active { background: rgba(102, 126, 234, 0.1); }
        .list-item { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: 0.15s; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .item-avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background-size: cover; }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .item-desc { font-size: 0.7rem; opacity: 0.65; margin-top: 3px; }
        .action-btn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 6px 16px; border-radius: 30px; color: white; font-size: 0.75rem; cursor: pointer; }
        .admin-btn { background: #f59e0b; color: #1f2937; }
        .danger-btn { background: #e74c3c; border: none; padding: 6px 12px; border-radius: 20px; color: white; font-size: 0.7rem; cursor: pointer; margin-left: 8px; }
        .donate-card { border-radius: 24px; padding: 20px; margin: 10px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .donate-stats { font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .qr-code { text-align: center; margin: 20px 0; padding: 20px; background: white; border-radius: 20px; display: inline-block; width: 100%; }
        .qr-code img { max-width: 200px; width: 100%; margin: 0 auto; display: block; border-radius: 16px; }
        .donate-link { background: rgba(0,0,0,0.05); padding: 12px; border-radius: 30px; margin-top: 15px; word-break: break-all; font-size: 0.8rem; }
        .donate-link a { color: #3498db; text-decoration: none; }
        .copy-btn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; padding: 8px 16px; border-radius: 30px; color: white; cursor: pointer; margin-top: 10px; }
        .section-title { padding: 16px 20px 8px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; }
        .search-box { padding: 12px 20px; }
        .search-box input { width: 100%; padding: 12px 18px; border-radius: 30px; font-size: 0.9rem; outline: none; }
        .no-results { padding: 40px; text-align: center; opacity: 0.5; font-size: 0.85rem; }
        .empty-state { text-align: center; padding: 60px 20px; opacity: 0.5; }
        .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; margin-left: 6px; }
        .profile-header { text-align: center; padding: 30px 20px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background-size: cover; }
        .settings-card { margin: 20px; padding: 16px; border-radius: 24px; background: rgba(0,0,0,0.03); }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .modal-card { position: relative; width: 500px; max-width: 90%; background: white; border-radius: 32px; padding: 24px; animation: fadeIn 0.2s; max-height: 80vh; overflow-y: auto; text-align: center; }
        body.dark .modal-card { background: #1e1e2e; }
        .modal-card .close-icon { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; }
        .modal-card h3 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea, #764ba2); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: white; width: 360px; max-width: 90%; border-radius: 40px; padding: 35px; text-align: center; }
        body.dark .auth-card { background: #1e1e2e; }
        .auth-card h2 { margin-bottom: 25px; font-size: 1.8rem; }
        .auth-card input { width: 100%; padding: 14px 18px; margin: 10px 0; border-radius: 40px; border: 1px solid #ddd; font-size: 1rem; }
        .auth-card button { width: 100%; padding: 14px; margin-top: 15px; border-radius: 40px; border: none; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: 600; cursor: pointer; }
        .switch-auth { margin-top: 20px; color: #667eea; cursor: pointer; font-size: 0.85rem; }
        .error-msg { color: #e74c3c; font-size: 0.8rem; margin-top: 10px; }
        .online-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #2ecc71; margin-left: 6px; animation: pulse 1.5s infinite; }
        @media (max-width: 768px) {
            body { padding: 0; }
            .app-container { width: 100%; height: 100vh; border-radius: 0; }
            .message { max-width: 85%; }
            .nav-item span { display: none; }
            .nav-item .nav-icon { font-size: 1.6rem; }
            .nav-item { padding: 6px 12px; }
            .attach-btn, .circle-btn, .send-btn, .voice-btn, .donate-btn { width: 44px; height: 44px; font-size: 1rem; }
            .modal-card { width: 95%; }
            .qr-code img { max-width: 150px; }
        }
    </style>
</head>
<body class="light">

<div class="app-container" id="appContainer" style="display: none;">
    <div class="messenger-header">
        <div class="logo-area">
            <div class="logo-icon">💬</div>
            <h1>Nexus</h1>
        </div>
        <div class="user-info">
            <div class="user-badge" id="currentUserDisplay">—</div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="tab-content active" id="chatsTab">
            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <div class="chat-header-left">
                        <div class="chat-header-avatar"></div>
                        <div class="chat-header-info">
                            <h3></h3>
                            <p></p>
                        </div>
                    </div>
                    <div class="call-buttons" id="callButtons" style="display: none;">
                        <button class="call-btn" id="audioCallBtn" title="Аудиозвонок">📞</button>
                    </div>
                </div>
                <div class="messages-area" id="messagesArea">
                    <div class="empty-state">✨ Выберите чат</div>
                </div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Сообщение..." enterkeyhint="send">
                    <button class="attach-btn" id="attachBtn" title="Прикрепить фото">📎</button>
                    <button class="circle-btn" id="circleBtn" title="Кружок (видео)">🔄</button>
                    <button class="voice-btn" id="voiceBtn">🎤</button>
                    <button class="donate-btn" id="donateBtn" title="Поддержать проект">💰</button>
                    <button class="send-btn" id="sendMsgBtn">📤</button>
                </div>
            </div>
        </div>
        
        <div class="tab-content" id="channelsTab">
            <div id="channelsList"></div>
        </div>
        
        <div class="tab-content" id="searchTab">
            <div class="search-box">
                <input type="text" id="globalSearchUsers" placeholder="🔍 Поиск людей...">
            </div>
            <div id="recentContactsSection">
                <div class="section-title">⭐ НЕДАВНИЕ КОНТАКТЫ</div>
                <div id="recentContactsList"></div>
            </div>
            <div id="searchResultsSection" style="display: none;">
                <div class="section-title">🔍 РЕЗУЛЬТАТЫ ПОИСКА</div>
                <div id="globalSearchResults"></div>
            </div>
        </div>
        
        <div class="tab-content" id="profileTab">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar"></div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-status" id="profileStatus"></div>
                <button class="action-btn" id="editProfileBtn" style="margin-top: 20px; padding: 10px 24px;">✏️ Редактировать</button>
                <button class="admin-btn" id="adminPanelBtn" style="margin-top: 10px; padding: 8px 20px;">👑 Админ-панель</button>
            </div>
            <div class="settings-card">
                <div class="setting-row">
                    <span>🎨 Тема оформления</span>
                    <select id="themeSelect">
                        <option value="light">Светлая</option>
                        <option value="dark">Тёмная</option>
                        <option value="hockey">🏒 Хоккейная</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    
    <div class="nav-bar">
        <div class="nav-item active" data-tab="chats"><div class="nav-icon">💬</div><span>Чаты</span></div>
        <div class="nav-item" data-tab="channels"><div class="nav-icon">📡</div><span>Каналы</span></div>
        <div class="nav-item" data-tab="search"><div class="nav-icon">🔍</div><span>Поиск</span></div>
        <div class="nav-item" data-tab="profile"><div class="nav-icon">👤</div><span>Профиль</span></div>
    </div>
</div>

<div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
        <h2>Добро пожаловать</h2>
        <input type="text" id="authUsername" placeholder="Имя пользователя">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="submitAuthBtn">Войти</button>
        <div class="switch-auth" id="switchModeBtn">Создать аккаунт</div>
        <div id="authError" class="error-msg"></div>
    </div>
</div>

<script>
    // МЕССЕНДЖЕР С QR-КОДОМ И ССЫЛКОЙ НА ДОНАТЫ
    let users = [], messages = [], customChannels = [], privateChats = [], userSubscriptions = {}, onlineUsers = {};
    let blockedUsers = [];
    let recentContacts = [];
    let donations = [];
    let donateStats = { total: 0, lastDonor: null, lastAmount: 0 };
    let currentUser = null, currentChat = { type: "channel", id: "general" }, isLoginMode = true, replyToMessageId = null, currentTab = "chats";
    const ADMIN_PASSWORD = "1101kulenkov12";
    const REACTIONS = ["👍", "❤️", "😂", "😮", "😢", "🔥", "🎉", "👏"];
    const DEFAULT_CHANNELS = [
        { id: "general", name: "💬 Общий чат", desc: "Все пользователи", emoji: "💬", isDefault: true },
        { id: "news", name: "📰 Новости", desc: "Главные события", emoji: "📰", isDefault: true },
        { id: "gaming", name: "🎮 Игры", desc: "Обсуждение игр", emoji: "🎮", isDefault: true },
        { id: "music", name: "🎵 Музыка", desc: "Новинки", emoji: "🎵", isDefault: true },
        { id: "random", name: "🎲 Случайный", desc: "Обо всём", emoji: "🎲", isDefault: true }
    ];
    const AVATAR_COLORS = ["#667eea", "#e74c3c", "#2ecc71", "#f39c12", "#9b59b6", "#1abc9c", "#e67e22", "#34495e"];

    // ✅ ВАША ССЫЛКА ДЛЯ ДОНАТОВ (ВСТАВЛЕНА)
    const DONATE_URL = "https://dalink.to/egor_kulenkov";

    // Функция генерации QR-кода
    function generateQRCode(text, size = 200) {

    // === Запись кружков (видео) ===
    let mediaRecorder = null;
    let videoChunks = [];
    let isRecording = false;
    let recordingStartTime = null;
    let recordingTimerInterval = null;
    let recordingStream = null;
    let recordingTimerElement = null;

    async function startCircleRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            recordingStream = stream;
            const videoPreview = document.createElement('video');
            videoPreview.srcObject = stream;
            videoPreview.autoplay = true;
            videoPreview.style.position = 'fixed';
            videoPreview.style.bottom = '100px';
            videoPreview.style.right = '20px';
            videoPreview.style.width = '120px';
            videoPreview.style.height = '120px';
            videoPreview.style.borderRadius = '50%';
            videoPreview.style.objectFit = 'cover';
            videoPreview.style.border = '3px solid #e74c3c';
            videoPreview.style.zIndex = '2000';
            videoPreview.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
            document.body.appendChild(videoPreview);
            
            mediaRecorder = new MediaRecorder(stream);
            videoChunks = [];
            
            mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) videoChunks.push(event.data); };
            mediaRecorder.onstop = () => {
                const videoBlob = new Blob(videoChunks, { type: 'video/mp4' });
                const reader = new FileReader();
                reader.onloadend = () => { sendCircleVideo(reader.result); };
                reader.readAsDataURL(videoBlob);
                if (recordingStream) recordingStream.getTracks().forEach(track => track.stop());
                if (videoPreview) videoPreview.remove();
                if (recordingTimerElement) recordingTimerElement.remove();
            };
            
            mediaRecorder.start(100);
            isRecording = true;
            recordingStartTime = Date.now();
            
            recordingTimerElement = document.createElement('div');
            recordingTimerElement.className = 'recording-timer';
            recordingTimerElement.innerHTML = '⏺ 0:00';
            document.body.appendChild(recordingTimerElement);
            
            recordingTimerInterval = setInterval(() => {
                if (!isRecording) return;
                let elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                let secs = elapsed % 60;
                let mins = Math.floor(elapsed / 60);
                if (recordingTimerElement) recordingTimerElement.innerHTML = `⏺ ${mins}:${secs.toString().padStart(2, '0')}`;
                if (elapsed >= 60) stopCircleRecording();
            }, 1000);
            
            const circleBtn = document.getElementById('circleBtn');
            if (circleBtn) circleBtn.classList.add('recording');
        } catch (err) {
            console.error("Ошибка доступа к камере:", err);
            alert("Не удалось получить доступ к камере. Разрешите доступ в браузере.");
        }
    }

    function stopCircleRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            if (recordingTimerInterval) clearInterval(recordingTimerInterval);
            const circleBtn = document.getElementById('circleBtn');
            if (circleBtn) circleBtn.classList.remove('recording');
        }
    }

    // === WebRTC для звонков ===
    let localStream = null, peerConnection = null, callActive = false, callStartTime = null, callTimerInterval = null;
    const configuration = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function startCall(targetUser) {
        if (callActive) { alert("Уже есть активный звонок"); return; }
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            peerConnection = new RTCPeerConnection(configuration);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.onicecandidate = (event) => { if (event.candidate) sendSignalingMessage(targetUser, { type: "candidate", candidate: event.candidate }); };
            peerConnection.ontrack = (event) => { if (!callActive) showIncomingCall(targetUser, event.streams[0]); };
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            sendSignalingMessage(targetUser, { type: "offer", offer: offer });
            showCallUI(targetUser, "outgoing");
        } catch (err) { alert("Не удалось получить доступ к микрофону"); }
    }

    function sendSignalingMessage(to, data) {
        let callMessages = JSON.parse(localStorage.getItem("chat_call_signals") || "{}");
        if (!callMessages[to]) callMessages[to] = [];
        callMessages[to].push({ from: currentUser, data: data, time: Date.now() });
        localStorage.setItem("chat_call_signals", JSON.stringify(callMessages));
    }

    function checkForIncomingCalls() {
        let callMessages = JSON.parse(localStorage.getItem("chat_call_signals") || "{}");
        if (callMessages[currentUser] && callMessages[currentUser].length) {
            let signals = callMessages[currentUser];
            for (let sig of signals) {
                if (sig.data.type === "offer" && !callActive) handleIncomingOffer(sig.from, sig.data.offer);
                else if (sig.data.type === "answer" && peerConnection && peerConnection.signalingState !== "closed") peerConnection.setRemoteDescription(new RTCSessionDescription(sig.data.answer));
                else if (sig.data.type === "candidate" && peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(sig.data.candidate));
            }
            callMessages[currentUser] = [];
            localStorage.setItem("chat_call_signals", JSON.stringify(callMessages));
        }
    }

    async function handleIncomingOffer(from, offer) {
        if (callActive) return;
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        peerConnection = new RTCPeerConnection(configuration);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        sendSignalingMessage(from, { type: "answer", answer: answer });
        peerConnection.ontrack = (event) => { if (!callActive) showIncomingCall(from, event.streams[0]); };
        showIncomingCall(from, null);
    }

    function showIncomingCall(from, stream) {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="call-card"><div class="call-avatar">📞</div><h2>Входящий звонок</h2><p>от ${escapeHtml(from)}</p><div class="call-buttons-large"><button class="call-action-btn answer" id="answerCallBtn">📞 Ответить</button><button class="call-action-btn decline" id="declineCallBtn">❌ Отклонить</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById('answerCallBtn').onclick = () => { callActive = true; modal.remove(); if (stream) { const audio = new Audio(); audio.srcObject = stream; audio.play(); } startCallTimer(); showCallUI(from, "active"); };
        document.getElementById('declineCallBtn').onclick = () => { if (peerConnection) peerConnection.close(); if (localStream) localStream.getTracks().forEach(t => t.stop()); modal.remove(); };
    }

    function showCallUI(target, type) {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="call-card"><div class="call-avatar">📞</div><h2>${type === "outgoing" ? "Идёт вызов..." : "Разговор"}</h2><p>${escapeHtml(target)}</p><div class="call-timer" id="callTimer">00:00</div><div class="call-buttons-large"><button class="call-action-btn end" id="endCallBtn">🔴 Завершить</button></div></div>`;
        document.body.appendChild(modal);
        if (type === "active") startCallTimer();
        document.getElementById('endCallBtn').onclick = () => { endCall(); modal.remove(); };
    }

    function startCallTimer() {
        callStartTime = Date.now();
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            if (!callActive) return;
            let elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            let mins = Math.floor(elapsed / 60), secs = elapsed % 60;
            let timerEl = document.getElementById('callTimer');
            if (timerEl) timerEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    }

    function endCall() {
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        callActive = false;
        if (callTimerInterval) clearInterval(callTimerInterval);
        peerConnection = null; localStream = null;
    }

    setInterval(checkForIncomingCalls, 1000);

            recentContacts.unshift({ username: username, lastInteraction: Date.now() });

        const stats = JSON.parse(localStorage.getItem("chat_donate_stats") || "{}");
        donateStats.total = stats.total || 0;
        donateStats.lastDonor = stats.lastDonor || null;
        donateStats.lastAmount = stats.lastAmount || 0;
        
        const theme = localStorage.getItem("chat_theme");
        if (theme) document.body.className = theme;
        else document.body.className = "light";
        if (document.getElementById("themeSelect")) document.getElementById("themeSelect").value = document.body.className;
    }
    
    function saveAll() {
        localStorage.setItem("chat_users", JSON.stringify(users));
        localStorage.setItem("chat_messages", JSON.stringify(messages));
        localStorage.setItem("chat_custom_channels", JSON.stringify(customChannels));
        localStorage.setItem("chat_private_chats", JSON.stringify(privateChats));
        localStorage.setItem("chat_subscriptions", JSON.stringify(userSubscriptions));
        localStorage.setItem("chat_online", JSON.stringify(onlineUsers));
        localStorage.setItem("chat_blocked_users", JSON.stringify(blockedUsers));
        localStorage.setItem("chat_donations", JSON.stringify(donations));
        localStorage.setItem("chat_donate_stats", JSON.stringify(donateStats));
    }
    
    function saveCustomChannels() {
        localStorage.setItem("chat_custom_channels", JSON.stringify(customChannels));
    }
    
    function saveMessages() {
        localStorage.setItem("chat_messages", JSON.stringify(messages));
    }
    
    function getAllChannels() { return [...DEFAULT_CHANNELS, ...customChannels]; }
    function getChannelById(id) { return getAllChannels().find(c => c.id === id); }
    function getUserSubscribedChannels(username) {
        if (!userSubscriptions[username]) { userSubscriptions[username] = DEFAULT_CHANNELS.map(c => c.id); saveAll(); }
        return userSubscriptions[username];
    }
    function getUserProfile(username) {
        const u = users.find(u => u.name === username);
        if (u && !u.profile) u.profile = { avatarColor: AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)], avatarEmoji: "😀", avatarImage: null, statusText: "В чате" };
        return u?.profile || { avatarColor: "#667eea", avatarEmoji: "😀", avatarImage: null, statusText: "В чате" };
    }
    function getAvatarHtml(profile, size=40) {
        if (profile.avatarImage) return `<img style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;" src="${profile.avatarImage}">`;
        else return `<div style="background:${profile.avatarColor};width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:${size/2}px;color:white;">${profile.avatarEmoji}</div>`;
    }
    function isUserOnline(username) { return onlineUsers[username] && (Date.now() - onlineUsers[username]) < 30000; }
    function updateOnlineStatus() { if(currentUser) { onlineUsers[currentUser] = Date.now(); saveAll(); } }
    setInterval(updateOnlineStatus, 5000);
    window.addEventListener('click', updateOnlineStatus);
    window.addEventListener('keypress', updateOnlineStatus);
    window.addEventListener('touchstart', updateOnlineStatus);

    function sendTextMessage(text) {
        if(!text.trim()) return;
        if(currentChat.type === "channel" && !getUserSubscribedChannels(currentUser).includes(currentChat.id)) { alert("Вы не подписаны на этот канал"); return; }
        let msg = { 
            id: Date.now()+"_"+Math.random().toString(36).substr(2,8), 
            type: currentChat.type, 
            msgType: "text", 
            from: currentUser, 
            text: text.trim(), 
            time: Date.now(),
            deletedForMe: false,
            deletedForEveryone: false
        };
        if(replyToMessageId) {
            let orig = messages.find(m=>m.id===replyToMessageId);
            if(orig) msg.replyTo = { id: orig.id, from: orig.from, text: orig.text?.substring(0,80) };
            replyToMessageId = null; document.getElementById("messageInput").placeholder = "Сообщение...";
        }
        if(currentChat.type === "channel") msg.channel = currentChat.id;
        else msg.chatId = currentChat.id;
        messages.push(msg); saveAll(); renderMessages();
        if(currentChat.type === "private") addToRecentContacts(currentChat.otherUser);
        setTimeout(()=>{ let a=document.getElementById("messagesArea"); if(a) a.scrollTop=a.scrollHeight; },100);
    }
    
    function addReaction(id, r) {
        let msg = messages.find(m=>m.id===id);
        if(!msg || msg.deletedForEveryone) return;
        if(!msg.reactions) msg.reactions={};
        if(!msg.reactions[r]) msg.reactions[r]=[];
        let idx = msg.reactions[r].indexOf(currentUser);
        if(idx!==-1) { msg.reactions[r].splice(idx,1); if(msg.reactions[r].length===0) delete msg.reactions[r]; }
        else msg.reactions[r].push(currentUser);
        saveAll(); renderMessages();
    }
    function replyTo(msgId) { 
        let m = messages.find(m=>m.id===msgId); 
        if(m && !m.deletedForEveryone){ 
            replyToMessageId=msgId; 
            let inp=document.getElementById("messageInput"); 
            inp.placeholder=`↩️ Ответ ${m.from}: ${m.text?.substring(0,50)}`; 
            inp.focus(); 
        } 
    }
    function forward(msgId) {
        let m = messages.find(m=>m.id===msgId);
        if(!m || m.deletedForEveryone) return;
        let content = "";
        if (m.msgType === "image") content = "📷 Фото";
        else if (m.msgType === "circle") content = "🔄 Кружок (видео)";
        else content = m.text;
        let newMsg = { 
            id: Date.now()+"_"+Math.random().toString(36).substr(2,8), 
            type: currentChat.type, 
            msgType:"text", 
            from:currentUser, 
            text:`📎 Переслано от ${m.from}: ${content}`, 
            time:Date.now(),
            deletedForMe: false,
            deletedForEveryone: false
        };
        if(currentChat.type==="channel") newMsg.channel=currentChat.id;
        else newMsg.chatId=currentChat.id;
        messages.push(newMsg); saveAll(); renderMessages();
        setTimeout(()=>{ let a=document.getElementById("messagesArea"); if(a) a.scrollTop=a.scrollHeight; },100);
    }
    
    function renderMessages() {
        let area = document.getElementById("messagesArea");
        if(!area) return;
        let chatMsgs = messages.filter(m=> {
            if(m.deletedForEveryone) return true;
            if(m.deletedForMe && m.from === currentUser) return false;
            if(currentChat.type==="channel") return m.type==="channel" && m.channel===currentChat.id;
            return m.type==="private" && m.chatId===currentChat.id;
        }).sort((a,b)=>a.time-b.time);
        if(chatMsgs.length===0) { area.innerHTML='<div class="empty-state">✨ Нет сообщений</div>'; return; }
        area.innerHTML = chatMsgs.map(msg=>{
            let isMine=currentUser===msg.from;
            let time=new Date(msg.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            let prof=getUserProfile(msg.from);
            
            let isDeleted = msg.deletedForEveryone;
            let replyHtml = (!isDeleted && msg.replyTo) ? `<div class="message-reply">↩️ <span>${escapeHtml(msg.replyTo.from)}</span>: ${escapeHtml(msg.replyTo.text)}</div>` : '';
            
            let contentHtml = '';
            if (isDeleted) {
                contentHtml = `<div style="font-style: italic; opacity: 0.6;">Сообщение удалено</div>`;
            } else if (msg.msgType === "image") {
                contentHtml = `<img class="message-image" src="${msg.image}" alt="Фото" onclick="window.openImageModal('${msg.image}')">`;
            } else if (msg.msgType === "circle") {
                contentHtml = `<video class="message-video" src="${msg.video}" autoplay loop muted playsinline style="border-radius: 50%; width: 180px; height: 180px; object-fit: cover; cursor: pointer;" onclick="window.openVideoModal('${msg.video}')"></video>`;
            } else if (msg.msgType === "system") {
                contentHtml = `<div style="font-style: italic; opacity: 0.7;">📢 ${escapeHtml(msg.text)}</div>`;
            } else {
                contentHtml = `<div>${escapeHtml(msg.text)}</div>`;
            }
            
            let reactHtml = '';
            if (!isDeleted && msg.reactions && Object.keys(msg.reactions).length) {
                reactHtml='<div class="message-reactions">';
                for(let [emoji,users] of Object.entries(msg.reactions)) reactHtml+=`<span class="reaction" data-emoji="${emoji}">${emoji} <span class="reaction-count">${users.length}</span></span>`;
                reactHtml+='</div>';
            }
            
            return `<div class="message ${isMine?'own':'other'} ${isDeleted ? 'deleted' : ''}" data-id="${msg.id}"><strong>${getAvatarHtml(prof,20)} ${escapeHtml(msg.from)}</strong>${replyHtml}${contentHtml}${reactHtml}<small>${time}</small></div>`;
        }).join('');
        document.querySelectorAll('.message').forEach(el=>{
            let mid=el.dataset.id, timer=null;
            let msg = messages.find(m=>m.id===mid);
            let isDeleted = msg?.deletedForEveryone;
            
            el.onclick=(e)=>{
                if(e.target.classList.contains('reaction')){ let em=e.target.closest('.reaction')?.dataset.emoji; if(em) addReaction(mid,em); return; }
                if(isDeleted) return;
                if(timer){ clearTimeout(timer); timer=null; showReactionPicker(e,mid); }
                else timer=setTimeout(()=>{ timer=null; },200);
            };
            el.oncontextmenu=(e)=>{
                e.preventDefault();
                if(isDeleted) return;
                showContextMenu(e,mid, msg?.from === currentUser);
            };
            let pt=null;
            el.ontouchstart=(e)=>{ 
                if(isDeleted) return;
                pt=setTimeout(()=>{ showContextMenu(e,mid, msg?.from === currentUser); pt=null; },500); 
            };
            el.ontouchend=()=>{ if(pt) clearTimeout(pt); };
        });
        let scrolled = area.scrollHeight - area.scrollTop <= area.clientHeight + 100;
        if(scrolled) area.scrollTop = area.scrollHeight;
    }
    
    function showContextMenu(e, messageId, isOwnMessage) {
        document.querySelector('.context-menu')?.remove();
        let m=document.createElement('div'); m.className='context-menu';
        
        let menuHtml = `
            <div class="context-menu-item" data-act="reply">↩️ Ответить</div>
            <div class="context-menu-item" data-act="forward">📤 Переслать</div>
        `;
        
        if (isOwnMessage) {
            menuHtml += `<div class="context-menu-divider"></div>`;
            menuHtml += `<div class="context-menu-item" data-act="delete_me">🗑️ Удалить у себя</div>`;
            menuHtml += `<div class="context-menu-item" data-act="delete_all">⚠️ Удалить у всех</div>`;
        }
        
        m.innerHTML = menuHtml;
        m.style.position = 'fixed';
        m.style.top = `${e.clientY}px`;
        m.style.left = `${e.clientX}px`;
        document.body.appendChild(m);
        
        m.querySelectorAll('.context-menu-item').forEach(it=>{ 
            it.onclick=()=>{
                if(it.dataset.act === 'reply') replyTo(messageId);
                else if(it.dataset.act === 'forward') forward(messageId);
                else if(it.dataset.act === 'delete_me') {
                    if(confirm("Удалить это сообщение только у себя?")) deleteMessageForMe(messageId);
                }
                else if(it.dataset.act === 'delete_all') {
                    if(confirm("Удалить это сообщение у всех? Это действие необратимо!")) deleteMessageForEveryone(messageId);
                }
                m.remove();
            };
        });
        
        setTimeout(()=>{ document.addEventListener('click',function close(ev){ if(!m.contains(ev.target)){ m.remove(); document.removeEventListener('click',close); } }); },10);
    }
    
    window.openImageModal = (imageSrc) => {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><img src="${imageSrc}" style="max-width:90%;max-height:90%;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.3);" onclick="this.parentElement.parentElement.remove()"></div>`;
        document.body.appendChild(modal);
        modal.onclick = () => modal.remove();
    };
    
    window.openVideoModal = (videoSrc) => {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><video src="${videoSrc}" controls autoplay style="max-width:90%;max-height:90%;border-radius:20px;" onclick="this.pause()"></video></div>`;
        document.body.appendChild(modal);
        modal.onclick = () => modal.remove();
    };
    
    function showReactionPicker(e,mid){
        let msg = messages.find(m=>m.id===mid);
        if(msg?.deletedForEveryone) return;
        document.querySelector('.reaction-picker')?.remove();
        let p=document.createElement('div'); p.className='reaction-picker';
        p.innerHTML=REACTIONS.map(r=>`<span class="reaction-option" data-r="${r}">${r}</span>`).join('');
        p.style.top=`${e.clientY-50}px`; p.style.left=`${e.clientX-100}px`;
        document.body.appendChild(p);
        p.querySelectorAll('.reaction-option').forEach(opt=>{ opt.onclick=()=>{ addReaction(mid,opt.dataset.r); p.remove(); }; });
        setTimeout(()=>{ document.addEventListener('click',function close(ev){ if(!p.contains(ev.target)){ p.remove(); document.removeEventListener('click',close); } }); },10);
    }

    function renderSidebar() {
        let container = document.getElementById("channelsList");
        if(!container) return;
        let subscribed = getUserSubscribedChannels(currentUser);
        let all = getAllChannels();
        let my = all.filter(ch=>subscribed.includes(ch.id));
        let html = `<div class="section-title">📡 МОИ КАНАЛЫ <button class="action-btn" id="addChannelBtn" style="padding:4px 12px;">+ Создать</button></div>`;
        html += my.map(ch=>`<div class="list-item" data-type="channel" data-id="${ch.id}"><div class="item-avatar" style="background:#667eea;">${ch.emoji}</div><div class="item-info"><div class="item-name">${ch.name}</div><div class="item-desc">${ch.desc}</div></div>${!ch.isDefault?`<button class="danger-btn" data-leave="${ch.id}">🚪</button>`:''}</div>`).join('');
        if(!my.length) html+=`<div class="no-results">Нет подписок</div>`;
        let available = all.filter(ch=>!subscribed.includes(ch.id));
        html+=`<div class="section-title">🔍 ДОСТУПНЫЕ КАНАЛЫ</div>`;
        html+=available.map(ch=>`<div class="list-item" data-sub="${ch.id}"><div class="item-avatar" style="background:#667eea;">${ch.emoji}</div><div class="item-info"><div class="item-name">${ch.name}</div><div class="item-desc">${ch.desc}</div></div><button class="action-btn" data-subscribe="${ch.id}">Подписаться</button></div>`).join('');
        if(!available.length) html+=`<div class="no-results">✨ Все каналы доступны</div>`;
        container.innerHTML=html;
        document.querySelectorAll('.list-item[data-type="channel"]').forEach(el=>{ el.onclick=(e)=>{ if(e.target.classList.contains('danger-btn'))return; currentChat={type:"channel",id:el.dataset.id}; switchTab("chats"); renderMessages(); updateChatHeader(); }; });
        document.querySelectorAll('.danger-btn[data-leave]').forEach(btn=>{ btn.onclick=(e)=>{ e.stopPropagation(); let id=btn.dataset.leave; if(confirm("Отписаться?")){ let subs=getUserSubscribedChannels(currentUser); userSubscriptions[currentUser]=subs.filter(s=>s!==id); saveAll(); renderSidebar(); if(currentChat.type==="channel" && currentChat.id===id){ currentChat={type:"channel",id:"general"}; renderMessages(); updateChatHeader(); } } }; });
        document.querySelectorAll('.action-btn[data-subscribe]').forEach(btn=>{ btn.onclick=(e)=>{ e.stopPropagation(); let id=btn.dataset.subscribe; let subs=getUserSubscribedChannels(currentUser); subs.push(id); userSubscriptions[currentUser]=subs; saveAll(); renderSidebar(); alert("Подписка оформлена!"); }; });
        document.getElementById("addChannelBtn")?.addEventListener('click',()=>showCreateChannelModal());
    }

    function renderSearch(){
        let input = document.getElementById("globalSearchUsers");
        let resultsDiv = document.getElementById("globalSearchResults");
        let searchSection = document.getElementById("searchResultsSection");
        let recentSection = document.getElementById("recentContactsSection");
        if(!input) return;
        let others = users.filter(u => u.name !== currentUser);
        input.oninput = () => {
            let q = input.value.toLowerCase();
            let res = others.filter(u => u.name.toLowerCase().includes(q));
            if (!q) {
                searchSection.style.display = "none";
                recentSection.style.display = "block";
            } else {
                searchSection.style.display = "block";
                recentSection.style.display = "none";
                if (res.length === 0) resultsDiv.innerHTML = '<div class="no-results">👤 Пользователей не найдено</div>';
                else {
                    resultsDiv.innerHTML = res.map(user => {
                        let prof = getUserProfile(user.name);

                                </div>`;
                    }).join('');

                        btn.onclick = (e) => { e.stopPropagation(); startPrivateChat(btn.dataset.startChat); };

                        el.onclick = (e) => { if (!e.target.classList.contains('action-btn')) startPrivateChat(el.dataset.user); };

            }

    function updateChatHeader(){
        let headerLeft = document.querySelector('.chat-header-left');
        let callDiv = document.getElementById('callButtons');
        if(currentChat.type==="channel"){
            let ch=getChannelById(currentChat.id);
            if(ch){
                headerLeft.innerHTML = `<div class="chat-header-avatar" style="background:#667eea;">${ch.emoji}</div><div class="chat-header-info"><h3>${ch.name}</h3><p>${ch.desc}</p></div>`;
                callDiv.style.display = "none";
            }
        }else{
            let prof=getUserProfile(currentChat.otherUser), onl=isUserOnline(currentChat.otherUser);
            headerLeft.innerHTML = `<div class="chat-header-avatar" style="background:${prof.avatarColor};">${prof.avatarEmoji}</div><div class="chat-header-info"><h3>${escapeHtml(currentChat.otherUser)} ${onl?'<span class="online-dot"></span>':''}</h3><p>${prof.statusText}</p></div>`;
            callDiv.style.display = "flex";
            document.getElementById('audioCallBtn').onclick = () => startCall(currentChat.otherUser);
        }
    }

    function switchTab(tab){
        currentTab=tab;
        document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
        document.getElementById(`${tab}Tab`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
        document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
        if(tab==='channels') renderSidebar();
        if(tab==='search') { renderSearch(); renderRecentContacts(); }
        if(tab==='profile') renderProfile();
        if(tab==='chats'){ renderMessages(); updateChatHeader(); }
    }

    // === ОСНОВНАЯ НАСТРОЙКА ===
    function setupApp(){
        updateOnlineStatus();
        loadRecentContacts();
        renderRecentContacts();
        setInterval(()=>{
            try {
                let nm = JSON.parse(localStorage.getItem("chat_messages") || "[]");
                if(JSON.stringify(nm) !== JSON.stringify(messages)){ messages = nm; if(currentTab === "chats") renderMessages(); }
                let nu = JSON.parse(localStorage.getItem("chat_users") || "[]");
                if(JSON.stringify(nu) !== JSON.stringify(users)){ users = nu; if(currentTab === "search") renderSearch(); if(currentTab === "profile") renderProfile(); }
                let np = JSON.parse(localStorage.getItem("chat_private_chats") || "[]");
                if(JSON.stringify(np) !== JSON.stringify(privateChats)){ privateChats = np; }
                let no = JSON.parse(localStorage.getItem("chat_online") || "{}");
                if(JSON.stringify(no) !== JSON.stringify(onlineUsers)){ onlineUsers = no; if(currentTab === "chats") updateChatHeader(); if(currentTab === "search") renderSearch(); renderRecentContacts(); }
                let nd = JSON.parse(localStorage.getItem("chat_donations") || "[]");
                if(JSON.stringify(nd) !== JSON.stringify(donations)){ donations = nd; }
            } catch(e) {}
        }, 500);
        
        window.addEventListener('storage',(e)=>{
            if(e.key === 'chat_messages'){ messages = JSON.parse(e.newValue || "[]"); if(currentTab === "chats") renderMessages(); }
            if(e.key === 'chat_online'){ onlineUsers = JSON.parse(e.newValue || "{}"); if(currentTab === "chats") updateChatHeader(); if(currentTab === "search") renderSearch(); renderRecentContacts(); }
        });
        
        document.getElementById("sendMsgBtn").onclick = () => { let inp = document.getElementById("messageInput"); sendTextMessage(inp.value); inp.value = ""; };
        document.getElementById("messageInput").onkeypress = e => { if(e.key === "Enter"){ let inp = document.getElementById("messageInput"); sendTextMessage(inp.value); inp.value = ""; } };
        document.getElementById("voiceBtn").onclick = () => alert("🎤 Голосовые сообщения в разработке");
        document.getElementById("donateBtn").onclick = () => showDonateModal();
        
        const circleBtn = document.getElementById("circleBtn");
        let pressTimer = null;
        circleBtn.addEventListener('mousedown', () => { pressTimer = setTimeout(() => startCircleRecording(), 200); });
        circleBtn.addEventListener('mouseup', () => { if(pressTimer) clearTimeout(pressTimer); if(isRecording) stopCircleRecording(); });
        circleBtn.addEventListener('mouseleave', () => { if(pressTimer) clearTimeout(pressTimer); if(isRecording) stopCircleRecording(); });
        circleBtn.addEventListener('touchstart', (e) => { e.preventDefault(); pressTimer = setTimeout(() => startCircleRecording(), 200); });
        circleBtn.addEventListener('touchend', () => { if(pressTimer) clearTimeout(pressTimer); if(isRecording) stopCircleRecording(); });
        
        const attachBtn = document.getElementById("attachBtn");
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = "image/*";
        fileInput.onchange = (e) => { const file = e.target.files[0]; if(file) { const reader = new FileReader(); reader.onload = (ev) => { sendPhoto(ev.target.result); }; reader.readAsDataURL(file); } fileInput.value = ""; };
        attachBtn.onclick = () => fileInput.click();
        
        document.getElementById("logoutBtn").onclick = () => { if(currentUser) onlineUsers[currentUser] = 0; saveAll(); if(callActive) endCall(); currentUser = null; document.getElementById("appContainer").style.display = "none"; document.getElementById("authOverlay").style.display = "flex"; isLoginMode = true; updateAuthUI(); };
        document.getElementById("editProfileBtn").onclick = () => editProfileModal();
        document.getElementById("adminPanelBtn").onclick = () => showAdminPanel();
        document.getElementById("themeSelect").onchange = e => { document.body.className = e.target.value; localStorage.setItem("chat_theme", e.target.value); };
        document.querySelectorAll('.nav-item').forEach(i => { i.onclick = () => switchTab(i.dataset.tab); });
        switchTab("chats");
    }

    function register(name, pass){ 
        if(!name.trim() || !pass.trim()) return "Заполните поля"; 
        if(users.find(u => u.name === name)) return "Пользователь существует"; 
        users.push({name: name, pass: pass, profile: {avatarColor: AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)], avatarEmoji: "😀", avatarImage: null, statusText: "В чате"}, isAdmin: false}); 
        userSubscriptions[name] = DEFAULT_CHANNELS.map(c => c.id); 
        saveAll(); 
        return true; 
    }
    
    function login(name, pass){ 
        let user = users.find(u => u.name === name && u.pass === pass); 
        if(!user) return "Неверные данные"; 
        if(blockedUsers.includes(name)) return "Ваш аккаунт заблокирован"; 
        return user; 
    }
    
    function updateAuthUI(){ 
        const title = document.querySelector(".auth-card h2");
        const btn = document.getElementById("submitAuthBtn");
        const switchBtn = document.getElementById("switchModeBtn");
        if(isLoginMode){ 
            title.innerHTML = "Добро пожаловать"; 
            btn.innerText = "Войти"; 
            switchBtn.innerText = "Создать аккаунт"; 
        } else { 
            title.innerHTML = "Регистрация"; 
            btn.innerText = "Зарегистрироваться"; 
            switchBtn.innerText = "Уже есть аккаунт? Войти"; 
        } 
    }
    
    function handleAuth(){ 
        const name = document.getElementById("authUsername").value.trim();
        const pass = document.getElementById("authPassword").value.trim();
        const errorDiv = document.getElementById("authError");
        errorDiv.innerText = ""; 
        if(!name || !pass){ 
            errorDiv.innerText = "Заполните поля"; 
            return; 
        } 
        if(isLoginMode){ 
            const result = login(name, pass); 
            if(typeof result === "string"){ 
                errorDiv.innerText = result; 
            } else { 
                currentUser = name; 
                const profile = getUserProfile(currentUser);
                document.getElementById("currentUserDisplay").innerHTML = `${getAvatarHtml(profile, 24)} ${name} <span class="online-indicator"></span>`; 
                document.getElementById("appContainer").style.display = "flex"; 
                document.getElementById("authOverlay").style.display = "none"; 
                setupApp(); 
            } 
        } else { 
            const result = register(name, pass); 
            if(result === true){ 
                errorDiv.innerText = "✅ Аккаунт создан! Войдите."; 
                isLoginMode = true; 
                updateAuthUI(); 
                document.getElementById("authPassword").value = ""; 
            } else { 
                errorDiv.innerText = result; 
            } 
        } 
    }
    
    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    function init(){ 
        loadData(); 
        updateAuthUI(); 
        document.getElementById("submitAuthBtn").onclick = handleAuth; 
        document.getElementById("switchModeBtn").onclick = () => { isLoginMode = !isLoginMode; updateAuthUI(); document.getElementById("authError").innerText = ""; }; 
    }
    init();
</script>
</body>
</html>
